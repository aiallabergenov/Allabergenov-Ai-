name: Build ALLABERGENOV AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x install-allabergenov-ai-android.sh
          ./install-allabergenov-ai-android.sh
          cd android-app
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ALLABERGENOV-AI
          path: android-app/app/build/outputs/apk/debug/*.apk
